    h: {voice: hat, short: true, dec: 0.012, len: 0.04, rate: 32000, vol: 0.06, pan: -0.2, gm: 42}
    o: {voice: hat, short: true, dec: 0.06, len: 0.14, rate: 32000, vol: 0.06, pan: -0.2, gm: 46}
    c: {voice: crash, dec: 0.45, len: 1.4, vol: 0.08, gm: 49}

# ================================================================ SID
lead.sid_saw:
  doc: C64 saw lead through a resonant low-pass with a filter envelope; the SID sound.
  voice: sid
  wave: saw
  att: 0.005
  dec: 0.25
  sus: 0.6
  rel: 0.12
  cutoff: 1800
  res: 2.5
  fenv: 1.5
  fdec: 0.18
  vib: 0.25
  vib_rate: 6.5
  mix: {vol: 0.17, echo: 0.6, reverb: 0.15}
  gm: 81

lead.sid_pwm:
  doc: Pulse with slow PWM, filtered; hollow and shimmering.
  extends: lead.sid_saw
  wave: pulse
  duty: 0.35
  pwm: 0.25
  pwm_rate: 0.7
  cutoff: 2600
  res: 1.2
  fenv: 0.5
  gm: 80

lead.sid_sync:
  doc: Hard-synced saw with a filter sweep; aggressive, screaming lead for combat.
  extends: lead.sid_saw
  sync: 1.5
  cutoff: 1200
  res: 3.5
  fenv: 2.5
  fdec: 0.3
  flfo: 0.4
  flfo_rate: 0.25
  mix: {vol: 0.15, echo: 0.7, reverb: 0.2}

lead.sid_ring:
  doc: Ring-modulated triangle; bell-like, metallic - menus, magic, eerie leads.
  voice: sid
  wave: tri
  ring: 2.76
  att: 0.002
  dec: 0.4
  sus: 0.3
  rel: 0.3
  cutoff: 5000
  res: 0.8
  mix: {vol: 0.18, reverb: 0.6}
  gm: 14

arp.sid_pulse:
  doc: Thin SID pulse arp with a bright band-pass peak.
  voice: sid
  wave: pulse
  duty: 0.15
  dec: 0.15
  sus: 0.2
  rel: 0.02
  cutoff: 3000
  res: 1.5
  ftype: bp
  mix: {vol: 0.09, pan: 0.3}
  gm: 81

bass.sid_saw:
  doc: Saw bass with a snappy filter envelope; punchy C64 bass.
  voice: sid
  wave: saw
  att: 0.002
  dec: 0.18
  sus: 0.5
  rel: 0.05
  cutoff: 500
  res: 1.8
  fenv: 2.0
  fdec: 0.12
  mix: {vol: 0.28, bus: low, duck: 0.4}
  gm: 38

bass.sid_pulse:
  doc: Pulse bass with light PWM and low-pass; rounder than sid_saw.
  extends: bass.sid_saw
  wave: pulse
  duty: 0.3
  pwm: 0.1
  pwm_rate: 0.4
  cutoff: 420
  res: 1.2
  fenv: 1.2

pad.sid_pwm:
  doc: Slow PWM pulse pad with a lazy filter LFO (use with the pad generator).
  voice: sid
  wave: pulse
  duty: 0.5
  pwm: 0.35
  pwm_rate: 0.3
  att: 0.3
  dec: 0.5
  sus: 0.9
  rel: 0.5
  cutoff: 1400
  res: 1.0
  flfo: 0.6
  flfo_rate: 0.15
  mix: {vol: 0.06, reverb: 0.7, pan: 0}
  gm: 89

drone.sid_sync:
  doc: Low synced saw drone with a slow filter LFO; menacing floor for dungeons.
  voice: sid
  wave: saw
  sync: 1.25
  att: 0.6
  dec: 0.5
  sus: 1.0
  rel: 0.8
  cutoff: 600
  res: 2.0
  flfo: 1.0
  flfo_rate: 0.12
  mix: {vol: 0.22, bus: low, lp: 1500, duck: 0.3, reverb: 0.15}
  gm: 89

kit.sid:
  doc: C64 kit - pitched-noise kick, filtered noise snare, short metallic hats.
  pieces:
    k: {voice: kick, f0: 180, f1: 45, pitch_dec: 0.025, dec: 0.16, click: 0.4, crush: 0, len: 0.3, vol: 0.55, bus: low, gm: 36}
    s: {voice: snare, rate: 18000, dec: 0.09, tone_f: 170, tone: 0.5, crush: 1, len: 0.2, vol: 0.28, gm: 38}
    h: {voice: hat, dec: 0.012, len: 0.04, vol: 0.06, pan: -0.2, gm: 42}
    o: {voice: hat, dec: 0.06, len: 0.15, vol: 0.06, pan: -0.2, gm: 46}
    t: {voice: tom, vol: 0.35, bus: low, gm: 45}
    c: {voice: crash, dec: 0.5, len: 1.6, vol: 0.09, gm: 49}

# ================================================================ FM (Genesis-style)
