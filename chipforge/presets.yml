    t: {voice: fm, note: 50, len: 0.3, sweep: [-10, 0.12], alg: 0, ops: [{ratio: 1.5, level: 0.5, dec: 0.1, sus: 0}, {ratio: 1, level: 1, dec: 0.25, sus: 0, rel: 0.05}], vol: 0.4, bus: low, gm: 45}
    m: {voice: fm, note: 70, len: 0.4, alg: 1, feedback: 0.7, ops: [{ratio: 1.41, level: 0.9, dec: 0.15, sus: 0}, {ratio: 3.3, level: 0.6, dec: 0.1, sus: 0}, {ratio: 1, level: 0.6, dec: 0.2, sus: 0}, {ratio: 1, level: 1, dec: 0.3, sus: 0, rel: 0.1}], vol: 0.12, pan: 0.2, reverb: 0.5, gm: 56}
