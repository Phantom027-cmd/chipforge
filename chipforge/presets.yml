# ================================================================ GM-style 16-bit palette
lead.gm_square:
  doc: Clean band-limited square lead with vibrato; the 16-bit take on a chip lead.
  voice: wave
  table: pulse
  dec: 0.2
  sus: 0.8
  rel: 0.08
  vib: 0.25
  mix: {vol: 0.18, echo: 0.5, reverb: 0.2}
  gm: 80

lead.gm_saw:
  doc: Clean saw lead; bright and smooth.
  extends: lead.gm_square
  table: saw
  mix: {vol: 0.15, echo: 0.5, reverb: 0.2, lp: 8000}
  gm: 81

lead.gm_flute:
  doc: Breathy sine-ish flute (sine table, slow attack, vibrato); calm, overworld, credits.
  voice: wave
  table: sine
  att: 0.06
  dec: 0.3
  sus: 0.85
  rel: 0.15
  vib: 0.3
  vib_rate: 5.0
  vib_delay: 0.25
  mix: {vol: 0.24, reverb: 0.5, echo: 0.3}
  gm: 73

bass.gm_pick:
  doc: Picked bass (bass table, quick decay).
  voice: wave
  table: bass
  dec: 0.25
  sus: 0.5
  rel: 0.05
  mix: {vol: 0.32, bus: low, duck: 0.3}
  gm: 34

pad.gm_strings:
  doc: Band-limited saw strings pad, slow and soft (use with the pad generator).
  voice: wave
  table: saw
  att: 0.35
  dec: 0.5
  sus: 0.9
  rel: 0.6
  vib: 0.1
  vib_rate: 4.5
  mix: {vol: 0.045, reverb: 0.9, lp: 3500}
  gm: 48

pad.gm_organ:
  doc: Organ pad (drawbar-style table).
  extends: pad.gm_strings
  table: organ
  att: 0.05
  rel: 0.2
  mix: {vol: 0.05, reverb: 0.6, lp: 5000}
  gm: 16

lead.gm_bell:
  doc: Bell table with long decay; celesta-like twinkle.
  voice: wave
  table: bell
  dec: 1.0
  sus: 0.0
  rel: 0.5
  mix: {vol: 0.2, reverb: 0.7, pan: 0.2}
  gm: 8

kit.gm:
  doc: Cleaner 16-bit-style kit - deeper kick, snappier snare, open hats, toms.
  pieces:
    k: {voice: kick, f0: 190, f1: 44, pitch_dec: 0.025, dec: 0.25, click: 0.3, crush: 0, len: 0.4, vol: 0.6, bus: low, gm: 36}
    s: {voice: snare, rate: 26000, dec: 0.1, tone_f: 200, tone: 0.5, crush: 1, len: 0.25, vol: 0.28, reverb: 0.3, gm: 38}
    h: {voice: hat, dec: 0.015, len: 0.05, vol: 0.06, pan: -0.2, gm: 42}
    o: {voice: hat, dec: 0.08, len: 0.2, vol: 0.06, pan: -0.2, gm: 46}
    t: {voice: tom, vol: 0.4, bus: low, gm: 45}
    c: {voice: crash, dec: 0.7, len: 2.2, vol: 0.09, reverb: 0.4, gm: 49}

# ================================================================ SFX-style hits (any chip)
kit.sfx:
  doc: Sound-effect hits for drama - metal clank, steam, alarm, roar, boom, zap, power-up, explosion.
  pieces:
    clank: {voice: clank, vol: 0.12, reverb: 0.6, gm: 56}
    steam: {voice: hiss, len: 0.8, vol: 0.08, gm: 52}
    alarm: {voice: siren, from: 76, to: 77, slide: 0.25, len: 0.8, vol: 0.07, width: 0.012, gm: 80}
    roar: {voice: groan, vol: 0.16, lp: 1800, reverb: 0.3, gm: 87}
    boom: {voice: kick, f0: 120, f1: 30, pitch_dec: 0.08, dec: 0.6, click: 0.1, crush: 0, len: 1.2, vol: 0.6, bus: low, reverb: 0.4, gm: 35}
    zap: {voice: siren, from: 96, to: 48, slide: 0.12, duty: 0.25, len: 0.15, sus: 1.0, vol: 0.12, gm: 80}
    powerup: {voice: pulse, note: 72, len: 0.5, arp: [0, 4, 7, 12, 16, 19], arp_rate: 2, duty: 0.25, dec: 0.3, sus: 0.6, rel: 0.1, vol: 0.14, echo: 0.5, gm: 80}
    explosion: {voice: crash, rate: 12000, dec: 0.8, len: 2.5, vol: 0.14, lp: 3000, reverb: 0.6, gm: 49}
    eerie: {voice: eerie, vol: 0.05, reverb: 0.8, gm: 97}
