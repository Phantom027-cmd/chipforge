# Game-over template: one-shot, ~10 s, slow descent that resolves on the final chord.
chipforge: 1
title: Game Over Template
cue: gameover
tempo: 72
time: 4/4
key: Dm
chip: nes
mode: enhanced
seed: 10
loop: false

channels:
  lead:  {preset: lead.pulse50, reverb: 0.6, echo: 0.6}
  harm:  {preset: lead.harmony25, reverb: 0.5}
  pad:   {preset: pad.pulse}
  bass:  {preset: bass.tri_sub}

patterns:
  descent:
    bars: 3
    chords: "Dm | Bb A | Dm"
    lead: "o5 a4 g4 f4 e4 | d4 c+4 d2 | d1"
    harm: "o5 f4 e4 d4 c+4 | <b-4> a4 f2 | f1"
    pad:  {gen: pad, voicing: [0, 1, 2], low: d4}
    bass: {gen: root, low: d2, gate: 0.98}

arrangement: [descent]
