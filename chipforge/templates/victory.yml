# Victory fanfare template: one-shot, ~6 s, ends on the tonic with a ring-out.
chipforge: 1
title: Victory Template
cue: victory
tempo: 140
time: 4/4
key: C
chip: nes
mode: enhanced
seed: 8
loop: false

channels:
  lead:  {preset: lead.pulse25, reverb: 0.4}
  harm:  {preset: lead.harmony50}
  arp:   {preset: arp.pulse12}
  bass:  {preset: bass.tri_sub}
  drums: {preset: kit.nes}

patterns:
  fanfare:
    bars: 3
    chords: "C | F G | C"
    lead: "o5 g8 g8 g8 r8 >c4< g8 e8 | f8 a8 >c4< g4. e8 | >c1<"
    harm: "o5 e8 e8 e8 r8 g4 e8 c8 | d8 f8 a4 e4. c8 | e1"
    arp:  {gen: arp, rate: 1, every: 2, low: c5}
    bass: {gen: riff, steps: "0 . . . 0 . . . 0 . . . 0 . . . | 0:8 0:8 | 0:16", low: c2, gate: 0.9}
    drums:
      k: "x.x.x...x...x...|x...x...x.......|x..............."
      s: "....x.......x...|....x...x.x.x.x.|................"
      events: [{at: "3:1", hit: c}]

arrangement: [fanfare]
