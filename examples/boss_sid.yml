    chords: "Fm | Fm | Db | Db | G | G | G | G"
    lead: "@vib(0.4,5,0.3) o4 f2 a-4 g4 | f2. r4 | f4 a-4 >c2< | b-2 a-4 g4 | b2 >d4< b4 | g2. r4 | f2 d4 f4 | g1"
    bass: {gen: riff, steps: "0:4 .:4 0:3 .:1 0:2 .:2", low: c2, gate: 0.9}
    sub:  {gen: root, low: c1}
    drone: {gen: drone, low: c2}
    drums:
      k: "x.......x......."
      s: "........x......."
      t: "..............x."
      events: [{at: "8:9", roll: s, len: 8, ramp: [0.3, 1.0]}]
