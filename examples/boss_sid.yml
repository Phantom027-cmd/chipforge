    bars: 8
    chords: "Cm | Cm | Ab | Bb | Cm | Cm | Ab | G7"
    lead: "o5 c8 c16 c16 e-8 d8 c4 <g4> | c8 e-8 g8 f8 e-8 d8 c4 | a-8 >c8 e-4 c8< a-8 g4 | b-8 >d8 f4 d8< b-8 f4 | c8 c16 c16 e-8 d8 c4 <g4> | c8 e-8 g8 b-8 g8 f8 e-4 | a-8 >c8 e-8 f8 e-4 c4< | b4 d8 b8 f4 >g4<"
    harm: {gen: harmony, of: lead, interval: -2, scale: harmonic_minor}
    bass: {gen: riff, steps: "0 0 12 0 0 12 0 7", low: c2, gate: 0.75}
    sub:  {gen: root, low: c1, retrig: [0, 8]}
    arp:  {gen: arp, tones: [0, 1, 2, 3], rate: 1, every: 2, low: c4}
    drums:
