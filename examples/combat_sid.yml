# Fast C64-style combat loop: synced saw lead, PWM harmony, filtered saw bass, pitched-noise kit,
# with a half-time breakdown. 32 bars at 172 BPM.
chipforge: 1
title: Blade Circuit
cue: combat
tempo: 172
time: 4/4
key: Am
chip: sid
mode: enhanced
seed: 5
loop: true

channels:
  lead:  {preset: lead.sid_saw, pan: 0.1}
  harm:  {preset: lead.sid_pwm, vol: 0.55, pan: -0.3, layer: 2}
  arp:   {preset: arp.sid_pulse, layer: 2}
  bass:  {preset: bass.sid_saw}
  drone: {preset: drone.sid_sync, layer: 3}
  drums: {preset: kit.sid}
  sfx:   {preset: kit.sfx, layer: 3}

patterns:
  A:
    bars: 8
    chords: "Am | Am | F | G | Am | Am | F | E"
    lead: "o5 a8 a16 a16 >c8< b16 a16 g8 a8 e4 | a8 >c8 e8 d8 c8< b8 a4 | f8 a8 >c4< a8 f8 e4 | g8 b8 >d4< b8 g8 d4 | a8 a16 a16 >c8< b16 a16 g8 a8 e4 | a8 >c8 e8 g8 e8 d8 c4< | f8 a8 >c8 d8 c4< a4 | g+4 e8 g+8 b4 >e4<"
    harm: {gen: harmony, of: lead, interval: -2, scale: harmonic_minor}
    bass: {gen: riff, steps: "0 0 12 0 0 12 0 7", low: a1, gate: 0.75}
    arp:  {gen: arp, tones: [0, 2, 3], rate: 1, every: 1, low: a4}
    drums:
      k: "x..x..x...x.x..."
      s: "....x.......x..."
      h: "xgxgxgxgxgxgxgxg"
      events: [{at: "1:1", hit: c}, {at: "8:13", roll: s, len: 4, ramp: [0.5, 1.0]}]
    sfx: [{at: "1:1", hit: boom}]
    exits: [4, 8]
  break:
    bars: 8
    chords: "Dm | Dm | F | F | E | E | E | E"
    lead: "o4 a2 >d4< a4 | f4 e4 d2 | a2. g8 a8 | f1 | g+2 e4 g+4 | b2 a4 g+4 | e1 | r2 r4 e8 f8"
    bass: {gen: riff, steps: "0:4 .:4 0:3 .:1 0:2 .:2", low: a1, gate: 0.9}
    drone: {gen: drone, low: a2}
    drums:
      k: "x.......x.......|x.......x.......|x.......x.......|x.......x.......|x.......x.......|x.......x.......|x...x...x...x...|x...x...x...x..."
      s: "........x.......|........x.......|........x.......|........x.......|........x.......|........x.......|....x.......x...|....x..........."
      t: "................|................|................|..............xx|................|................|................|........xx..xx.."
      events: [{at: "8:13", roll: s, len: 4, ramp: [0.4, 1.0]}]
    sfx: [{at: "1:1", hit: alarm}, {at: "5:1", hit: alarm}]
    exits: [4, 8]
  B:
    bars: 8
    chords: "Am | G | F | E | Am | G | F | E"
    lead: "o5 e8 e16 e16 g8 e8 d4 c4 | d8 d16 d16 f8 d8 c4 <b4> | c8 c16 c16 e8 c8 <b4 a4> | g+4 b4 >e2< | e8 e16 e16 g8 a8 b4 a8 g8 | d8 g8 b8 >d8< b4 g4 | f4 a8 >c8 e4 d8 c8< | b2 >e4< r4"
    harm: {gen: harmony, of: lead, interval: -2, scale: harmonic_minor}
    bass: {gen: riff, steps: "0 . 0 . 12 . 0 . 0 . 0 . 7 . 12 .", low: a1, gate: 0.75}
    arp:  {gen: arp, tones: [0, 2, 3, 5], rate: 1, every: 2, low: a4}
    drums:
      k: "x...x...x..x..x."
      s: "....x.......x..."
      h: "xgxgxgxgxgxgxgxg"
      o: "..............x."
      events: [{at: "1:1", hit: c}, {at: "8:9", roll: s, len: 8, ramp: [0.3, 1.0]}]
    exits: [4, 8]

arrangement:
  - A
  - {use: break, mute: [arp]}
  - B
  - {use: A, as: A2, channels: {arp: {vol: 1.2}}}
