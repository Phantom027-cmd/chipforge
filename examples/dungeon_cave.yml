# Cave dungeon: slow, hollow, a lonely 12.5% pulse lead over a detuned drone, sparse heartbeat
# drums and a cave ambience stem (drips, rumble, rock falls). 24 bars at 84 BPM, loops.
chipforge: 1
title: Hollow Depths
cue: dungeon
tempo: 84
time: 4/4
key: Dm
chip: nes
mode: enhanced
seed: 44
loop: true
ambience: {bed: cave, level: -15}
mix:
  reverb: {size: 3.5, decay: 1.1, tone: 3000}

channels:
  lead:  {preset: lead.pulse12, reverb: 0.7, echo: 0.9, pan: 0.1}
  echo2: {preset: lead.tri, vol: 0.5, reverb: 0.8, pan: -0.4, layer: 2}
  pad:   {preset: pad.pulse_wide, layer: 2}
  drone: {preset: drone.pwm_detuned, vol: 0.8}
  bass:  {preset: bass.tri_sub}
  drums: {preset: kit.nes_dark, vol: 0.6}

patterns:
  A:
    bars: 8
    chords: "Dm | Dm | Bb | A | Dm | Dm | Gm | A"
    lead: "o5 d2 f4 e4 | d2. r4 | f4 g4 a2 | g4 e4 c+2 | d2 f4 a4 | g2. r4 | b-4 a4 g4 f4 | e2 c+4 r4"
    echo2: "o4 r2 d2 | r1 | r2 f2 | r1 | r2 d2 | r1 | r2 g2 | r1"
    drone: {gen: drone, low: d2}
    bass:  {gen: riff, steps: "0:8 .:4 0:2 .:2", low: d2, gate: 0.9}
    drums:
      k: "x.......|........|x.......|........|x.......|........|x.......|........"
      m: "........|......o.|........|........|........|......o.|........|......x."
      events: [{at: "5:1", hit: groan, from: 45, to: 33, dur: 3.0}]
    exits: [4, 8]
  B:
    bars: 8
    chords: "Gm | Gm | Dm | Dm | Bb | A | Dm | A"
    lead: "o5 g2 b-4 a4 | g4 f4 d2 | f2 a4 g4 | f4 e4 d2 | d4 f4 b-2 | a4 g4 e2 | f2 d4 e4 | c+1"
    pad:   {gen: pad, voicing: [0, 1, 2], low: d4}
    drone: {gen: drone, low: d2}
    bass:  {gen: riff, steps: "0:8 .:4 0:2 .:2", low: d2, gate: 0.9}
    drums:
      k: "x.......|........|x.......|........|x.......|........|x.......|x......."
      events: [{at: "8:9", roll: s, len: 8, every: 2, ramp: [0.1, 0.5]}, {at: "1:1", hit: eerie, len: 64}]
    exits: [4, 8]
  C:
    bars: 8
    chords: "Dm | Dm | Bb | Bb | Gm | Gm | A | A"
    lead: "o5 a2 f4 d4 | e2. r4 | f4 d4 b-2 | a2 r2 | g2 b-4 >d4< | a2. r4 | e2 g4 e4 | c+1"
    echo2: "o4 r2 a2 | r1 | r2 f2 | r1 | r2 g2 | r1 | r2 e2 | r1"
    pad:   {gen: pad, voicing: [0, 1, 2], low: d4}
    drone: {gen: drone, low: d2}
    bass:  {gen: riff, steps: "0:4 .:4 0:4 .:4", low: d2, gate: 0.9}
    drums:
      k: "x.......|x.......|x.......|x.......|x.......|x.......|x.......|x......."
      m: "......o.|........|......o.|........|......o.|........|......x.|........"
    exits: [4, 8]

arrangement:
  - {use: A, mute: [echo2, drone], channels: {drums: {vol: 0.5}}}
  - B
  - {use: C, channels: {drums: {vol: 1.3}, lead: {vol: 1.1}}}
